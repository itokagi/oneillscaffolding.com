[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=3072"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/send-contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/quote"
  to = "/.netlify/functions/send-quote"
  status = 200
  force = true

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/send-apply"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/forms-login"
  to = "/.netlify/functions/forms-login"
  status = 200

[[redirects]]
  from = "/api/auth/forms-check"
  to = "/.netlify/functions/forms-check"
  status = 200

[[redirects]]
  from = "/api/auth/forms-logout"
  to = "/.netlify/functions/forms-logout"
  status = 200
